name: EFFIS-gegevens dagelijks bijwerken

on:
  schedule:
    # GitHub cron gebruikt UTC. Dit is 07:23 tijdens de Belgische zomertijd
    # en 06:23 tijdens de wintertijd. Een tijd buiten het hele uur verkleint
    # de kans op vertraging in de GitHub Actions-wachtrij.
    - cron: "23 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: effis-gegevens-bijwerken
  cancel-in-progress: false

jobs:
  gegevens-bijwerken:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Repository ophalen
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: R instellen
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: R-afhankelijkheden installeren
        uses: r-lib/actions/setup-r-dependencies@v2

      - name: Lokale pijplijntests uitvoeren
        run: |
          Rscript tests/test_pipeline.R
          Rscript tests/test_effis_pipeline.R

      - name: Actuele EFFIS-brandgebieden ophalen en exporteren
        run: Rscript scripts/update_effis.R

      - name: Aangemaakte EFFIS-bestanden valideren
        run: Rscript scripts/check_effis_outputs.R

      - name: Gewijzigde gegevens vastleggen
        shell: bash
        run: |
          git add \
            data/effis_bronselectie.json \
            data/effis_metagegevens.json \
            data/flourish_effis_branden.csv \
            data/flourish_effis_actualiteitssamenvatting.csv
          if git diff --cached --quiet; then
            echo "Geen gegevenswijziging om te committen."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "gegevens: EFFIS-momentopname bijwerken [skip ci]"

          branch="${GITHUB_REF_NAME}"
          git pull --rebase origin "${branch}"
          git push origin "HEAD:${branch}"
